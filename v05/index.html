<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Evi v0.5 Geliştirme</title><style>body{background:#101a2f;color:white;font:16px system-ui;margin:0;padding:20px}main{max-width:730px;margin:auto}section{border:1px solid #46516b;background:#19263e;border-radius:14px;margin:14px 0;padding:15px}input,textarea{font:inherit;box-sizing:border-box;width:100%;background:#0b1325;color:white;border:1px solid #5b6c85;border-radius:10px;padding:10px;margin:6px 0 12px}textarea{min-height:100px}button{background:#4b67e8;color:white;border:0;border-radius:10px;padding:12px;margin:5px 5px 5px 0}button:disabled{opacity:.5}.answer{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9e4ff}small{color:#b7c6df}strong{color:#fff}</style><main><h1>🏠 AI Evi v0.5</h1><small>Deneysel geliştirme ekranı. Canlı v0.4'ten ayrıdır.</small><section><label>Worker adresi (v0.5 özel dağıtım gerekir)<input id="endpoint" type="url" placeholder="https://...workers.dev"></label><label>ACCESS_TOKEN<input id="secret" type="password" autocomplete="off"></label><label>Görev<textarea id="question" placeholder="Bir çözüm tasarlayın, karşılıklı inceleyin."></textarea></label><button id="start">Yeni görüşme</button><button id="continue" disabled>Sonraki aşamaya devam</button><button id="status" disabled>Durumu yenile</button><p id="message">Henüz işlem yok.</p></section><section><strong>GPT ilk taslak</strong><div class="answer" id="gptDraft"></div></section><section><strong>Gemini eleştiri</strong><div class="answer" id="geminiReview"></div></section><section><strong>GPT revizyon</strong><div class="answer" id="gptRevision"></div></section><section><strong>Gemini son değerlendirme</strong><div class="answer" id="geminiFinal"></div></section><section><strong>Sonuç / Berker onayı</strong><div class="answer" id="result"></div></section></main><script>
let id=sessionStorage.getItem("ai_evi_v05_test_id")||"",busy=false;const $=x=>document.getElementById(x);
const req=async(path,method="GET",body)=>{const base=$("endpoint").value.trim().replace(/\/$/,"");if(!/^https:\/\/[^/]+$/.test(base))throw Error("HTTPS Worker adresi gerekli");const r=await fetch(base+path,{method,headers:{Authorization:"Bearer "+$("secret").value,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||("HTTP "+r.status));return data};
const paint=d=>{for(const k of ["gptDraft","geminiReview","gptRevision","geminiFinal"]) {const v=d[k];try{$(k).textContent=k.startsWith("gemini")?JSON.stringify(JSON.parse(v),null,2):(v||"Bekliyor")}catch{$(k).textContent=v||"Bekliyor"}}$("result").textContent=d.result||"Bekliyor";$("message").textContent="Aşama: "+d.stage+" | Durum: "+d.status+(d.error?" | "+d.error:"");$("status").disabled=false;$("continue").disabled=!(["READY","WAITING"].includes(d.status)&&d.stage!=="DONE")};
const call=async fn=>{if(busy)return;busy=true;for(const k of ["start","continue","status"])$(k).disabled=true;try{const d=await fn();paint(d)}catch(e){$("message").textContent="Hata: "+e.message}finally{busy=false}};
$("start").onclick=()=>call(async()=>{id=crypto.randomUUID();sessionStorage.setItem("ai_evi_v05_test_id",id);return req("/v05/start","POST",{id,question:$("question").value.trim()})});
$("continue").onclick=()=>call(()=>req("/v05/step","POST",{id}));
$("status").onclick=()=>call(()=>req("/v05/status?id="+encodeURIComponent(id)));
$("message").textContent="Görüşmeler sunucuda saklanır. Her aşama tek istek; hata olursa durumu kontrol edip devam et. OpenAI hatası belirsizse manuel inceleme gerekir.";
</script></html>
