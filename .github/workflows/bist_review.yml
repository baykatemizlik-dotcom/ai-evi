name: BIST External Gemini Audit
on:
  schedule:
    - cron: '20 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bist-external-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install numeric dependencies
        run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Audit code and end-of-session D1 report
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python3 bridge/bist_review.py
