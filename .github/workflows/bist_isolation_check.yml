name: BIST Strategy Isolation Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [feat/scalp-trend-isolation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix tests/ui --ignore-scripts --no-audit --no-fund
      - run: node --test tests/ui/dashboard.test.cjs
      - run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - run: python3 build_worker.py
      - name: No uncommitted generated bundle
        run: git diff --exit-code -- worker/index.js
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
