name: BIST Cloud Bridge
on:
  schedule:
    - cron: '0,15,30,45 7-14 * * 1-5'
    - cron: '0,15 15 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bist_sync.yml
      - bridge/bist_sync.py
      - bridge/bist_universe.py
      - bridge/bist_universe_snapshot.json
      - bridge/requirements.txt
permissions:
  contents: read
concurrency:
  group: bist-cloud-feed
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      universe: ${{ steps.universe.outputs.universe }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install numeric filters
        run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Test bridge and paper accounting
        run: |
          python3 -m unittest discover -s tests -p 'test_cloud_bridge.py'
          node --test tests/cloud_bridge.test.mjs
      - name: Load all KAP equity-market symbols
        id: universe
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
        run: python3 bridge/bist_sync.py --prepare
  sync:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install numeric filters
        run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Feed closed 15m bars
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BIST_UNIVERSE_JSON: ${{ needs.prepare.outputs.universe }}
          BIST_SHARD_INDEX: ${{ matrix.shard }}
          BIST_SHARD_COUNT: '8'
          BIST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 bridge/bist_sync.py

  finalize:
    needs: [prepare, sync]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install numeric filters
        run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Review the entire momentum pool with GPT-4o-mini
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
          BIST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 bridge/bist_sync.py --finalize
