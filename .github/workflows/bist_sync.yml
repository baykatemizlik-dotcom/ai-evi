name: BIST Cloud Bridge
on:
  schedule:
    - cron: '4-59/5 7-15 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bist_sync.yml
      - bridge/main_feed_session.py
      - bridge/bist_sync.py
      - bridge/bist_universe.py
      - bridge/bist_universe_snapshot.json
      - bridge/requirements.txt
      - worker/cloud_bridge.mjs
      - worker/index.js
env:
  TZ: Europe/Istanbul
permissions:
  contents: read
  actions: write
concurrency:
  group: bist-cloud-feed
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  continuous:
    if: ${{ vars.BIST_MAIN_FEED_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install existing numeric filters
        run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Verify unchanged engine and feed plus new orchestration
        run: |
          python3 -m unittest discover -s tests -p 'test_cloud_bridge.py'
          python3 -m unittest discover -s tests -p 'test_main_feed_session.py'
          node --test tests/*.test.mjs
      - name: Five-minute main scan with unchanged eight shards and AI review
        id: session
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 -u bridge/main_feed_session.py
      - name: Continue the same main feed after session completion
        if: ${{ success() && steps.session.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bridge/main_feed_session.py --handoff
