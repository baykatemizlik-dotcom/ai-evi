name: BIST Independent Trend Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '10,40 7-14 * * 1-5'
  push:
    branches: [main]
    paths: [bridge/bist_trend.py, bridge/trend_feed_session.py, .github/workflows/bist_trend.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: bist-trend-radar
  cancel-in-progress: false
jobs:
  trend:
    runs-on: ubuntu-latest
    if: ${{ vars.BIST_TREND_FEED_PAUSED != 'true' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Verify trend source clock and session recovery
        run: |
          python3 -m unittest discover -s tests -p 'test_bist_trend.py'
          python3 -m unittest discover -s tests -p 'test_trend_feed_session.py'
      - name: Independent hourly and daily trend sessions with eight shards
        id: session
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
        run: python3 -u bridge/trend_feed_session.py
      - name: Continue the same trend feed after session completion
        if: ${{ success() && steps.session.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bridge/trend_feed_session.py --handoff
