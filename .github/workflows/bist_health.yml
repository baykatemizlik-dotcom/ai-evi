name: BIST Read-only Connectivity Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bridge/bist_health.py, .github/workflows/bist_health.yml]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r bridge/requirements.txt
      - name: Check authenticated Worker and Yahoo without paper writes
        env:
          BIST_WORKER_URL: ${{ vars.BIST_WORKER_URL || 'https://ai-evi.baykatemizlik.workers.dev' }}
          BIST_INGEST_TOKEN: ${{ secrets.BIST_INGEST_TOKEN }}
        run: python3 bridge/bist_health.py
